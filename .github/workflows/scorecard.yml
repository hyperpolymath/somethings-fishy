# SPDX-License-Identifier: MPL-2.0
name: OSSF Scorecard

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  scorecard:
    # The reusable's scorecard job needs these; a caller job must grant
    # at least what the called workflow requests (hypatia WF018).
    permissions:
      contents: read
      security-events: write
      id-token: write
    uses: hyperpolymath/standards/.github/workflows/scorecard-reusable.yml@571cc734cd69fb846032ec77a662aa8ee4fc32cd
